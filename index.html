<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Qaya Print - Cetak Struk</title>
  <style>
    :root {
      --prime-500: #C7510F;
      --prime-600: #B3480D;
      --neutral-50: #FAFAFA;
      --neutral-100: #F5F5F5;
      --neutral-200: #E5E5E5;
      --neutral-400: #A3A3A3;
      --neutral-500: #737373;
      --neutral-700: #404040;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--neutral-50);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .card {
      background: white;
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      box-shadow: var(--shadow-md);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: var(--prime-500);
      font-size: 1.8rem;
      margin-bottom: var(--space-2);
    }
    .store-name {
      font-weight: 600;
      color: var(--neutral-700);
      margin-bottom: var(--space-4);
    }
    .preview {
      background: var(--neutral-100);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin: var(--space-4) 0;
      text-align: left;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
    }
    .btn {
      display: block;
      width: 100%;
      padding: var(--space-4);
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin: var(--space-3) 0;
    }
    .btn-connect {
      background: var(--prime-500);
      color: white;
    }
    .btn-connect.connected {
      background: #27ae60;
    }
    .btn-print {
      background: var(--prime-600);
      color: white;
    }
    .btn-print:disabled {
      background: var(--neutral-200);
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--neutral-100);
      color: var(--neutral-700);
      border: 1px solid var(--neutral-200);
    }
    .status {
      font-size: 0.9rem;
      color: var(--neutral-500);
      margin-top: var(--space-3);
      min-height: 24px;
    }
    .status-connected { color: #27ae60; }
    .status-disconnected { color: #c0392b; }
    .error { color: #d32f2f; }
    .success { color: #2e7d32; }
    .info { color: var(--prime-500); }
    .logo {
      width: 60px;
      height: 60px;
      background: var(--prime-500);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-4);
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Q</div>
    <h1>Qaya Print</h1>
    <div class="store-name" id="storeName">-</div>
    
    <div class="preview" id="preview">Memuat data...</div>
    
    <button class="btn btn-connect" id="connectBtn" onclick="connectToPrinter()">
      Hubungkan Printer
    </button>
    <button class="btn btn-print" id="printBtn" onclick="printReceipt()" disabled>
      Cetak Struk
    </button>
    <button class="btn btn-secondary" onclick="window.close()">
      Kembali ke Qaya
    </button>
    
    <div class="status status-disconnected" id="status">
      Printer belum terhubung
    </div>
  </div>

  <script>
    // ========== AMBIL DATA DARI URL ==========
    const urlParams = new URLSearchParams(window.location.search);
    const encodedData = urlParams.get('d');
    
    let receiptData = null;
    let escposCommands = null;
    
    if (!encodedData) {
      document.getElementById('preview').textContent = 'Error: Data struk tidak ditemukan.';
      document.getElementById('status').innerHTML = '<span class="error">Parameter "d" tidak ada</span>';
    }
    
    try {
      const jsonStr = atob(decodeURIComponent(encodedData));
      receiptData = JSON.parse(jsonStr);
      
      document.getElementById('storeName').textContent = receiptData.store_name || 'Toko';
      document.getElementById('preview').textContent = generatePreview(receiptData);
      escposCommands = buildESCOSCommands(receiptData);
      
      document.getElementById('status').innerHTML = 
        '<span class="info">Siap mencetak — Hubungkan printer terlebih dahulu</span>';
    } catch (e) {
      document.getElementById('preview').textContent = 'Error: Data rusak atau tidak valid.';
      document.getElementById('status').innerHTML = '<span class="error">' + e.message + '</span>';
    }
    
    function generatePreview(data) {
      let text = '';
      text += data.store_name + '\n';
      text += data.store_address + '\n';
      text += data.date + '\n';
      text += '─'.repeat(32) + '\n';
      text += 'Item          Qty   Subtotal\n';
      text += '─'.repeat(32) + '\n';
      if (data.items) {
        data.items.forEach(item => {
          const name = (item.name || '').substring(0, 15).padEnd(15);
          const qty = String(item.qty || 1).padStart(4);
          const subtotal = 'Rp ' + (item.subtotal || 0).toLocaleString('id-ID');
          text += name + ' ' + qty + ' ' + subtotal.padStart(10) + '\n';
        });
      }
      text += '─'.repeat(32) + '\n';
      text += 'TOTAL: Rp ' + (data.total || 0).toLocaleString('id-ID') + '\n';
      text += (data.footer || 'Terima kasih telah berbelanja') + '\n';
      return text;
    }
    
    function buildESCOSCommands(data) {
      const encoder = new TextEncoder();
      let cmd = [];
      
      // Init printer
      cmd.push(0x1B, 0x40); // ESC @
      
      // Center align, double size untuk nama toko
      cmd.push(0x1B, 0x61, 0x01); // ESC a 1 (center)
      cmd.push(0x1D, 0x21, 0x11); // GS ! 17 (double height & width)
      const storeName = encoder.encode((data.store_name || 'Toko') + '\n');
      cmd = cmd.concat(Array.from(storeName));
      
      // Normal font, small
      cmd.push(0x1D, 0x21, 0x00); // GS ! 0 (normal)
      cmd.push(0x1B, 0x4D, 0x01); // ESC M 1 (small font)
      const storeAddr = encoder.encode((data.store_address || '') + '\n');
      cmd = cmd.concat(Array.from(storeAddr));
      
      // Normal font
      cmd.push(0x1B, 0x4D, 0x00); // ESC M 0 (normal)
      const date = encoder.encode((data.date || '') + '\n');
      cmd = cmd.concat(Array.from(date));
      
      // Divider
      const divider = encoder.encode('─'.repeat(32) + '\n');
      cmd = cmd.concat(Array.from(divider));
      
      // Header items
      cmd.push(0x1B, 0x61, 0x00); // ESC a 0 (left)
      const header = encoder.encode('Item          Qty   Subtotal\n');
      cmd = cmd.concat(Array.from(header));
      const divider2 = encoder.encode('─'.repeat(32) + '\n');
      cmd = cmd.concat(Array.from(divider2));
      
      // Items
      if (data.items) {
        data.items.forEach(item => {
          const name = (item.name || '').substring(0, 15).padEnd(15);
          const qty = String(item.qty || 1).padStart(4);
          const subtotal = 'Rp ' + (item.subtotal || 0).toLocaleString('id-ID');
          const line = encoder.encode(name + ' ' + qty + ' ' + subtotal.padStart(10) + '\n');
          cmd = cmd.concat(Array.from(line));
        });
      }
      
      // Total
      const divider3 = encoder.encode('─'.repeat(32) + '\n');
      cmd = cmd.concat(Array.from(divider3));
      cmd.push(0x1B, 0x61, 0x02); // ESC a 2 (right)
      cmd.push(0x1D, 0x21, 0x11); // double
      const totalLine = encoder.encode('TOTAL\n');
      cmd = cmd.concat(Array.from(totalLine));
      const totalValue = encoder.encode('Rp ' + (data.total || 0).toLocaleString('id-ID') + '\n');
      cmd = cmd.concat(Array.from(totalValue));
      
      // Footer
      cmd.push(0x1D, 0x21, 0x00); // normal
      cmd.push(0x1B, 0x61, 0x01); // center
      cmd.push(0x0A); // feed
      const footer = encoder.encode((data.footer || 'Terima kasih telah berbelanja') + '\n');
      cmd = cmd.concat(Array.from(footer));
      cmd.push(0x0A, 0x0A); // feed 2 lines
      
      // Cut paper
      cmd.push(0x1D, 0x56, 0x41, 0x00); // GS V A 0 (partial cut)
      
      return new Uint8Array(cmd);
    }
    
    // ========== WEB SERIAL API ==========
    let port = null;
    let writer = null;
    
    async function connectToPrinter() {
      const btn = document.getElementById('connectBtn');
      const status = document.getElementById('status');
      
      if (!('serial' in navigator)) {
        status.innerHTML = '<span class="error">Web Serial API tidak didukung. Gunakan Chrome/Edge.</span>';
        return;
      }
      
      try {
        btn.textContent = 'Menghubungkan...';
        btn.disabled = true;
        
        // Minta user memilih port
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        writer = port.writable.getWriter();
        
        // Update UI
        btn.textContent = '✓ Printer Terhubung';
        btn.classList.add('connected');
        btn.disabled = false;
        document.getElementById('printBtn').disabled = false;
        status.innerHTML = '<span class="status-connected">Printer siap digunakan</span>';
      } catch (err) {
        btn.textContent = 'Hubungkan Printer';
        btn.disabled = false;
        if (err.name === 'NotFoundError') {
          status.innerHTML = '<span class="status-disconnected">Tidak ada printer dipilih</span>';
        } else {
          status.innerHTML = '<span class="error">Gagal: ' + err.message + '</span>';
        }
        console.error(err);
      }
    }
    
    async function printReceipt() {
      const btn = document.getElementById('printBtn');
      const status = document.getElementById('status');
      
      if (!escposCommands) {
        status.innerHTML = '<span class="error">Tidak ada data untuk dicetak</span>';
        return;
      }
      
      if (!writer) {
        status.innerHTML = '<span class="error">Hubungkan printer terlebih dahulu</span>';
        return;
      }
      
      try {
        btn.disabled = true;
        btn.textContent = 'Mencetak...';
        status.innerHTML = '<span class="info">Mengirim data ke printer...</span>';
        
        await writer.write(escposCommands);
        
        status.innerHTML = '<span class="success">Struk berhasil dicetak!</span>';
        btn.textContent = 'Cetak Ulang';
        btn.disabled = false;
      } catch (err) {
        status.innerHTML = '<span class="error">Gagal mencetak: ' + err.message + '</span>';
        btn.textContent = 'Coba Lagi';
        btn.disabled = false;
        console.error(err);
      }
    }
    
    // Bersihkan saat halaman ditutup
    window.addEventListener('beforeunload', async () => {
      if (writer) {
        try { await writer.close(); } catch (e) {}
      }
      if (port) {
        try { await port.close(); } catch (e) {}
      }
    });
  </script>
</body>
</html>
