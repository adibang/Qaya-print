<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qaya Print</title>
  <style>
    :root { --prime-500: #C7510F; --neutral-50: #FAFAFA; --neutral-100: #F5F5F5; --neutral-200: #E5E5E5; --neutral-500: #737373; --neutral-700: #404040; --radius-md: 8px; --radius-lg: 12px; --shadow-md: 0 4px 12px rgba(0,0,0,0.08); --space-3: 12px; --space-4: 16px; --space-6: 24px; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, sans-serif; background: var(--neutral-50); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-4); }
    .card { background: white; border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--shadow-md); max-width: 400px; width:100%; text-align: center; }
    h1 { color: var(--prime-500); font-size: 1.8rem; margin-bottom: var(--space-2); }
    .preview { background: var(--neutral-100); border-radius: var(--radius-md); padding: var(--space-4); margin: var(--space-4) 0; text-align: left; font-family: monospace; font-size: 0.75rem; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
    .btn { display: block; width: 100%; padding: var(--space-4); border: none; border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; cursor: pointer; margin: var(--space-3) 0; }
    .btn-connect { background: var(--prime-500); color: white; }
    .btn-connect.connected { background: #27ae60; }
    .btn-print { background: var(--prime-500); color: white; }
    .btn-print:disabled { background: var(--neutral-200); cursor: not-allowed; }
    .btn-secondary { background: var(--neutral-100); border:1px solid var(--neutral-200); color: var(--neutral-700); }
    .status { font-size: 0.85rem; margin-top: var(--space-3); }
    .success { color: #27ae60; } .error { color: #d32f2f; } .info { color: var(--prime-500); }
  </style>
</head>
<body>
<div class="card">
  <h1>Qaya Print</h1>
  <div class="preview" id="preview">Memuat...</div>
  <button class="btn btn-connect" id="connectBtn" onclick="connect()">Hubungkan Printer</button>
  <button class="btn btn-print" id="printBtn" onclick="printReceipt()" disabled>Cetak Struk</button>
  <button class="btn btn-secondary" onclick="window.close()">Kembali</button>
  <div class="status" id="status">Printer belum terhubung</div>
</div>
<script>
let receiptData = null, escposCommands = null, port = null, writer = null;

const params = new URLSearchParams(location.search);
const d = params.get('d');
if (!d) {
  document.getElementById('preview').textContent = 'Error: Parameter tidak ditemukan.';
} else {
  try {
    const json = atob(decodeURIComponent(d));
    receiptData = JSON.parse(json);
    document.getElementById('preview').textContent = buildPreview(receiptData);
    escposCommands = buildESCOS(receiptData);
    document.getElementById('status').innerHTML = '<span class="info">Siap cetak — hubungkan printer</span>';
  } catch (e) {
    document.getElementById('preview').textContent = 'Error: Data rusak / tidak valid.\n' + e.message;
    document.getElementById('status').innerHTML = '<span class="error">Gagal membaca data</span>';
  }
}

function buildPreview(d) {
  let t = (d.header||'') + '\n' + d.store_name + '\n' + d.store_address + '\n';
  if (d.store_phone) t += 'Telp: ' + d.store_phone + '\n';
  if (d.outlet_name) t += 'Outlet: ' + d.outlet_name + '\n';
  t += 'Kasir: ' + (d.cashier||'-') + '\n';
  if (d.customer) t += 'Cust: ' + d.customer + '\n';
  t += d.date + '\n' + '-'.repeat(32) + '\n';
  t += 'Item          Qty   Subtotal\n' + '-'.repeat(32) + '\n';
  (d.items||[]).forEach(i => t += i.name.substring(0,15).padEnd(15) + ' ' + String(i.qty).padStart(4) + ' ' + ('Rp '+(i.subtotal||0).toLocaleString('id-ID')).padStart(10) + '\n');
  t += '-'.repeat(32) + '\n';
  if (d.discount) t += 'Diskon: Rp ' + d.discount.toLocaleString('id-ID') + '\n';
  t += 'TOTAL: Rp ' + (d.total||0).toLocaleString('id-ID') + '\n';
  t += 'Bayar: Rp ' + (d.payment_amount||0).toLocaleString('id-ID') + '\n';
  t += 'Kembali: Rp ' + (d.change_amount||0).toLocaleString('id-ID') + '\n';
  t += 'Metode: ' + (d.payment_method||'Tunai') + '\n';
  t += '\n' + (d.footer||'Terima kasih');
  return t;
}

function buildESCOS(d) {
  const E = new TextEncoder();
  let c = [0x1B,0x40]; // reset
  if (d.header) { c.push(0x1B,0x61,0x01); c.push(...E.encode(d.header+'\n')); }
  c.push(0x1B,0x61,0x01); c.push(0x1B,0x45,0x01); c.push(...E.encode(d.store_name+'\n')); c.push(0x1B,0x45,0x00);
  if (d.store_address) { c.push(0x1B,0x61,0x00); c.push(...E.encode(d.store_address+'\n')); }
  if (d.store_phone) c.push(...E.encode('Telp: '+d.store_phone+'\n'));
  if (d.outlet_name) c.push(...E.encode('Outlet: '+d.outlet_name+'\n'));
  c.push(...E.encode('Kasir: '+(d.cashier||'Kasir')+'\n'));
  if (d.customer) c.push(...E.encode('Cust : '+d.customer+'\n'));
  c.push(...E.encode(d.date+'\n'));
  c.push(...E.encode('-'.repeat(32)+'\n'));
  c.push(...E.encode('Item          Qty   Subtotal\n'));
  c.push(...E.encode('-'.repeat(32)+'\n'));
  (d.items||[]).forEach(i => {
    const line = i.name.substring(0,15).padEnd(15) + ' ' + String(i.qty).padStart(4) + ' ' + ('Rp '+(i.subtotal||0).toLocaleString('id-ID')).padStart(10) + '\n';
    c.push(...E.encode(line));
  });
  c.push(...E.encode('-'.repeat(32)+'\n'));
  c.push(0x1B,0x61,0x02);
  if (d.discount) c.push(...E.encode('Diskon: Rp '+d.discount.toLocaleString('id-ID')+'\n'));
  c.push(0x1B,0x45,0x01); c.push(...E.encode('TOTAL: Rp '+(d.total||0).toLocaleString('id-ID')+'\n')); c.push(0x1B,0x45,0x00);
  c.push(...E.encode('Bayar: Rp '+(d.payment_amount||0).toLocaleString('id-ID')+'\n'));
  c.push(...E.encode('Kembali: Rp '+(d.change_amount||0).toLocaleString('id-ID')+'\n'));
  c.push(0x1B,0x61,0x01); c.push(...E.encode('Metode: '+(d.payment_method||'Tunai')+'\n'));
  c.push(0x0A); c.push(...E.encode((d.footer||'Terima kasih')+'\n')); c.push(0x0A,0x0A);
  c.push(0x1D,0x56,0x41,0x00);
  return new Uint8Array(c);
}

async function connect() {
  if (!('serial' in navigator)) { document.getElementById('status').innerHTML='<span class="error">Web Serial tidak didukung</span>'; return; }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });
    writer = port.writable.getWriter();
    document.getElementById('connectBtn').textContent = '✓ Printer Terhubung';
    document.getElementById('connectBtn').classList.add('connected');
    document.getElementById('printBtn').disabled = false;
    document.getElementById('status').innerHTML = '<span class="success">Printer siap</span>';
  } catch (e) {
    document.getElementById('status').innerHTML = '<span class="error">'+e.message+'</span>';
  }
}

async function printReceipt() {
  if (!writer) { document.getElementById('status').innerHTML='<span class="error">Hubungkan printer dulu</span>'; return; }
  try {
    await writer.write(escposCommands);
    document.getElementById('status').innerHTML = '<span class="success">Tercetak!</span>';
  } catch (e) {
    document.getElementById('status').innerHTML = '<span class="error">'+e.message+'</span>';
    writer = null; port = null;
  }
}
</script>
</body>
</html>
