<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qaya Print - Cetak Struk Bluetooth</title>
  <style>
    :root {
      --prime-500: #C7510F;
      --prime-600: #B3480D;
      --neutral-50: #FAFAFA;
      --neutral-100: #F5F5F5;
      --neutral-200: #E5E5E5;
      --neutral-400: #A3A3A3;
      --neutral-500: #737373;
      --neutral-700: #404040;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--neutral-50);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .card {
      background: white;
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      box-shadow: var(--shadow-md);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: var(--prime-500);
      font-size: 1.8rem;
      margin-bottom: var(--space-2);
    }
    .store-name {
      font-weight: 600;
      color: var(--neutral-700);
      margin-bottom: var(--space-4);
    }
    .preview {
      background: var(--neutral-100);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin: var(--space-4) 0;
      text-align: left;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
    }
    .btn {
      display: block;
      width: 100%;
      padding: var(--space-4);
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin: var(--space-3) 0;
    }
    .btn-print {
      background: var(--prime-500);
      color: white;
    }
    .btn-print:disabled {
      background: var(--neutral-200);
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--neutral-100);
      color: var(--neutral-700);
      border: 1px solid var(--neutral-200);
    }
    .status {
      font-size: 0.9rem;
      color: var(--neutral-500);
      margin-top: var(--space-3);
      min-height: 24px;
    }
    .error { color: #d32f2f; }
    .success { color: #2e7d32; }
    .info { color: var(--prime-500); }
    .logo {
      width: 60px;
      height: 60px;
      background: var(--prime-500);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-4);
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Q</div>
    <h1>Qaya Print</h1>
    <div class="store-name" id="storeName">-</div>
    
    <div class="preview" id="preview">Memuat data...</div>
    
    <button class="btn btn-print" id="printBtn" onclick="printViaBluetooth()">
      Cetak via Bluetooth
    </button>
    <button class="btn btn-secondary" onclick="window.close()">
      Kembali ke Qaya
    </button>
    
    <div class="status" id="status">
      <span class="info">Pastikan printer Bluetooth menyala</span>
    </div>
  </div>

  <script>
    // Ambil data dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const encodedData = urlParams.get('d');
    
    if (!encodedData) {
      document.getElementById('preview').textContent = 'Error: Data struk tidak ditemukan.';
      document.getElementById('printBtn').disabled = true;
      document.getElementById('status').innerHTML = '<span class="error">Parameter "d" tidak ada</span>';
    }
    
    let receiptData = null;
    let escposBytes = null;
    
    // Decode data
    try {
      const jsonStr = atob(decodeURIComponent(encodedData));
      receiptData = JSON.parse(jsonStr);
      
      // Tampilkan preview
      document.getElementById('storeName').textContent = receiptData.store_name || 'Toko';
      document.getElementById('preview').textContent = generatePreview(receiptData);
      
      // Generate ESC/POS bytes
      escposBytes = generateESCOS(receiptData);
      
      document.getElementById('status').innerHTML = 
        `<span class="info">Siap mencetak — ${escposBytes.length} byte</span>`;
    } catch (e) {
      document.getElementById('preview').textContent = 'Error: Data rusak atau tidak valid.';
      document.getElementById('printBtn').disabled = true;
      document.getElementById('status').innerHTML = `<span class="error">${e.message}</span>`;
    }
    
    function generatePreview(data) {
      let text = '';
      text += data.store_name + '\n';
      text += data.store_address + '\n';
      text += data.date + '\n';
      text += '─'.repeat(32) + '\n';
      text += 'Item          Qty   Subtotal\n';
      text += '─'.repeat(32) + '\n';
      data.items.forEach(item => {
        const name = item.name.substring(0, 15).padEnd(15);
        const qty = String(item.qty).padStart(4);
        const subtotal = String('Rp ' + item.subtotal.toLocaleString('id-ID')).padStart(10);
        text += `${name} ${qty} ${subtotal}\n`;
      });
      text += '─'.repeat(32) + '\n';
      text += 'TOTAL: Rp ' + data.total.toLocaleString('id-ID') + '\n';
      text += data.footer + '\n';
      return text;
    }
    
    function generateESCOS(data) {
      // Build ESC/POS commands
      const encoder = new TextEncoder();
      const parts = [];
      
      // Init
      parts.push(new Uint8Array([0x1B, 0x40])); // ESC @
      
      // Center align, double size for store name
      parts.push(new Uint8Array([0x1B, 0x61, 1])); // align center
      parts.push(new Uint8Array([0x1D, 0x21, 0x11])); // double h/w
      parts.push(encoder.encode(data.store_name + '\n'));
      parts.push(new Uint8Array([0x1D, 0x21, 0x00])); // normal
      parts.push(new Uint8Array([0x1B, 0x4D, 1])); // small font
      parts.push(encoder.encode(data.store_address + '\n'));
      parts.push(new Uint8Array([0x1B, 0x4D, 0])); // normal font
      parts.push(encoder.encode(data.date + '\n'));
      
      // Divider
      parts.push(encoder.encode('─'.repeat(32) + '\n'));
      
      // Items header
      parts.push(new Uint8Array([0x1B, 0x61, 0])); // align left
      parts.push(encoder.encode('Item          Qty   Subtotal\n'));
      parts.push(encoder.encode('─'.repeat(32) + '\n'));
      
      // Items
      data.items.forEach(item => {
        const name = item.name.substring(0, 15).padEnd(15);
        const qty = String(item.qty).padStart(4);
        const subtotal = String('Rp ' + item.subtotal.toLocaleString('id-ID')).padStart(10);
        parts.push(encoder.encode(`${name} ${qty} ${subtotal}\n`));
      });
      
      // Total
      parts.push(encoder.encode('─'.repeat(32) + '\n'));
      parts.push(new Uint8Array([0x1B, 0x61, 2])); // align right
      parts.push(new Uint8Array([0x1D, 0x21, 0x11])); // double
      parts.push(encoder.encode('TOTAL\n'));
      parts.push(encoder.encode('Rp ' + data.total.toLocaleString('id-ID') + '\n'));
      
      // Footer
      parts.push(new Uint8Array([0x1D, 0x21, 0x00])); // normal
      parts.push(new Uint8Array([0x1B, 0x61, 1])); // center
      parts.push(encoder.encode('\n' + data.footer + '\n'));
      parts.push(encoder.encode('\n\n'));
      
      // Cut
      parts.push(new Uint8Array([0x1D, 0x56, 0x00])); // full cut
      
      // Concatenate all parts
      const totalLen = parts.reduce((sum, p) => sum + p.length, 0);
      const result = new Uint8Array(totalLen);
      let offset = 0;
      parts.forEach(p => {
        result.set(p, offset);
        offset += p.length;
      });
      return result;
    }
    
    async function printViaBluetooth() {
      const btn = document.getElementById('printBtn');
      const status = document.getElementById('status');
      
      if (!escposBytes) {
        status.innerHTML = '<span class="error">Tidak ada data untuk dicetak</span>';
        return;
      }
      
      btn.disabled = true;
      btn.textContent = 'Menghubungkan...';
      status.innerHTML = '<span class="info">Meminta perangkat Bluetooth...</span>';
      
      try {
        if (!navigator.bluetooth) {
          throw new Error('Web Bluetooth tidak didukung. Gunakan Chrome/Edge.');
        }
        
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['00001101-0000-1000-8000-00805f9b34fb']
        });
        
        status.innerHTML = `<span class="info">Terhubung ke: ${device.name || 'Printer'}</span>`;
        
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('00001101-0000-1000-8000-00805f9b34fb');
        const characteristic = await service.getCharacteristic('00001101-0000-1000-8000-00805f9b34fb');
        
        status.innerHTML = '<span class="info">Mengirim data...</span>';
        
        // Kirim per chunk (512 byte)
        const CHUNK = 512;
        for (let i = 0; i < escposBytes.length; i += CHUNK) {
          const chunk = escposBytes.slice(i, i + CHUNK);
          await characteristic.writeValueWithoutResponse(chunk);
        }
        
        status.innerHTML = '<span class="success">Struk berhasil dicetak!</span>';
        btn.textContent = 'Cetak Lagi';
        btn.disabled = false;
        
        await device.gatt.disconnect();
      } catch (err) {
        status.innerHTML = `<span class="error">Error: ${err.message}</span>`;
        btn.textContent = 'Coba Lagi';
        btn.disabled = false;
        console.error(err);
      }
    }
  </script>
</body>
</html>
